name: Production Healthcheck

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Production base URL (e.g. https://fy-repository.vercel.app)"
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run healthcheck
        run: |
          chmod +x ./scripts/check-production-health.sh
          ./scripts/check-production-health.sh "${{ inputs.base_url }}"
